name: Sync openclaw_computer

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to source GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: |
          echo 'Pulling...'
          docker pull ghcr.io/tunmax/openclaw_computer:latest
          echo 'Pulled successfully'
      - name: Tag image
        run: docker tag ghcr.io/tunmax/openclaw_computer:latest ghcr.io/xyjmsk/openclaw_computer:latest
      - name: Login to dest GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          echo 'Pushing...'
          docker push ghcr.io/xyjmsk/openclaw_computer:latest
          echo 'Push complete'
