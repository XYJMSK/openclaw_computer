name: Sync openclaw_computer

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check image
        run: |
          echo 'Checking if source image exists...'
          docker manifest inspect ghcr.io/tunmax/openclaw_computer:latest || echo 'Image not found'
      - name: Pull image
        run: |
          docker pull ghcr.io/tunmax/openclaw_computer:latest || echo 'Pull failed'
      - name: Tag
        run: |
          docker tag ghcr.io/tunmax/openclaw_computer:latest ghcr.io/xyjmsk/openclaw_computer:latest || echo 'Tag failed'
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker push ghcr.io/xyjmsk/openclaw_computer:latest || echo 'Push failed'
